[package]
name = "carina-codegen-aws"
version.workspace = true
edition = "2024"
license = "MIT"
publish = false

[lib]
doctest = false

[[bin]]
name = "smithy-codegen"
path = "src/main.rs"

[dependencies]
carina-core = { workspace = true }
carina-provider-protocol = { workspace = true }
carina-aws-types = { path = "../carina-aws-types", default-features = false }
carina-docgen = { path = "../carina-docgen" }
carina-smithy = { path = "../carina-smithy" }
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
heck = "0.5"
html-escape = "0.2"

[dev-dependencies]
tempfile = "3"
