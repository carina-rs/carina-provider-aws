[workspace]
members = [
    "carina-aws-types",
    "carina-docgen",
    "carina-provider-aws",
    "carina-provider-aws-wasm-tests",
    "carina-codegen-aws",
    "carina-smithy",
]
default-members = [
    "carina-aws-types",
    "carina-docgen",
    "carina-provider-aws",
    "carina-codegen-aws",
    "carina-smithy",
]
resolver = "3"

[workspace.package]
version = "0.10.0"

# Every crate in this workspace must build against the same carina revision;
# pin it once here so the crates cannot drift apart.
[workspace.dependencies]
carina-core = { git = "https://github.com/carina-rs/carina", rev = "375ce42450e41af53a56da110c4ce146d46627e7" }
carina-plugin-sdk = { git = "https://github.com/carina-rs/carina", rev = "375ce42450e41af53a56da110c4ce146d46627e7", features = ["aws"] }
carina-plugin-host = { git = "https://github.com/carina-rs/carina", rev = "375ce42450e41af53a56da110c4ce146d46627e7" }
carina-provider-protocol = { git = "https://github.com/carina-rs/carina", rev = "375ce42450e41af53a56da110c4ce146d46627e7" }
carina-provider-resolver = { git = "https://github.com/carina-rs/carina", rev = "375ce42450e41af53a56da110c4ce146d46627e7" }
