[workspace]
members = [
    "carina-aws-types",
    "carina-docgen",
    "carina-provider-aws",
    "carina-provider-aws-wasm-tests",
    "carina-codegen-aws",
    "carina-smithy",
]
default-members = [
    "carina-aws-types",
    "carina-docgen",
    "carina-provider-aws",
    "carina-codegen-aws",
    "carina-smithy",
]
resolver = "3"

[workspace.package]
version = "0.7.4"

# Every crate in this workspace must build against the same carina revision;
# pin it once here so the crates cannot drift apart.
[workspace.dependencies]
carina-core = { git = "https://github.com/carina-rs/carina", rev = "f6a02e19" }
carina-plugin-sdk = { git = "https://github.com/carina-rs/carina", rev = "f6a02e19" }
carina-plugin-host = { git = "https://github.com/carina-rs/carina", rev = "f6a02e19" }
carina-provider-protocol = { git = "https://github.com/carina-rs/carina", rev = "f6a02e19" }
carina-provider-resolver = { git = "https://github.com/carina-rs/carina", rev = "f6a02e19" }
