[package]
name = "carina-docgen"
version.workspace = true
edition = "2024"
license = "MIT"
publish = false

[dependencies]
comrak = { version = "=0.54.0", default-features = false }
finl_unicode = { version = "=1.4.0", default-features = false, features = ["categories"] }
flate2 = "1"
tar = { version = "0.4", default-features = false }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
