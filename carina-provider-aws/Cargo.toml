[package]
name = "carina-provider-aws"
version.workspace = true
edition = "2024"
license = "MIT"
description = "AWS provider for Carina infrastructure management tool"
repository = "https://github.com/carina-rs/carina-provider-aws"
homepage = "https://github.com/carina-rs/carina-provider-aws"

[[bin]]
name = "carina-provider-aws"
path = "src/main.rs"

[features]
default = ["native"]
native = []
test-utils = ["carina-core/test-utils"]

[dependencies]
carina-core = { workspace = true }
carina-aws-types = { path = "../carina-aws-types" }
carina-plugin-sdk = { workspace = true }
carina-provider-protocol = { workspace = true }
indexmap = "2"
aws-credential-types = { version = "1" }
aws-smithy-async = { version = "1", features = ["rt-tokio"] }
aws-smithy-types = { version = "1" }
aws-smithy-runtime-api = { version = "1" }
aws-types = { version = "1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
heck = "0.5"
urlencoding = "2"
regex = "1"
uuid = { version = "1", features = ["serde", "v4"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }
wasi = "0.14"

# In-process AWS service emulator for integration tests. Host-only —
# the WASM target does not exercise these (it goes through
# `wasi:http` to a real endpoint). PoC seed for #355 (STS data source);
# follow-ups will reuse the same dev-deps for other services.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
aws-smithy-runtime = { version = "1", features = ["client"] }
carina-core = { workspace = true, features = ["test-support", "test-utils"] }
carina-codegen-aws = { path = "../carina-codegen-aws" }
# Enable the test constructor for integration tests without exposing it in production.
carina-provider-aws = { path = ".", features = ["test-utils"] }
carina-aws-types = { path = "../carina-aws-types", features = ["test-utils"] }
carina-plugin-sdk = { workspace = true, features = ["test-utils"] }
tokio = { version = "1", features = ["test-util"] }
winterbaume-core = "0.2"
winterbaume-s3 = "0.2"
winterbaume-sts = "0.2"
