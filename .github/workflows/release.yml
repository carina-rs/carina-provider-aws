name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    if: github.event_name == 'push'
    uses: carina-rs/provider-release/.github/workflows/build.yml@25d0c075c00be49a703b532c91739cc5dc163fb4
    with:
      provider: carina-provider-aws
      name: aws
      namespace: carina-rs
      docs-generate: |
        ./scripts/generate-schemas-smithy.sh
        ./scripts/generate-provider.sh
        if ! git diff --exit-code; then
          echo "::error::Codegen produced uncommitted changes. Upstream Smithy models no longer match the committed schemas; regenerate and commit them before releasing."
          exit 1
        fi
        ./scripts/generate-docs.sh

  release:
    name: Create Release
    needs: [build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create Release
        uses: carina-rs/provider-release/github-release@25d0c075c00be49a703b532c91739cc5dc163fb4
        with:
          provider: carina-provider-aws

  publish:
    name: Publish to Carina Registry
    needs: [release]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Publish to Carina Registry
        # Signing/publish intentionally stay in this job so OIDC job_workflow_ref and the
        # Fulcio SAN remain this release.yml (the registry's trusted-publisher policy points
        # here); bump the SHA only after reviewing the provider-release diff.
        uses: carina-rs/provider-release/publish@25d0c075c00be49a703b532c91739cc5dc163fb4
        with:
          provider: carina-provider-aws
          name: aws
          namespace: carina-rs

  yank:
    name: Yank from Carina Registry
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Yank from Carina Registry
        uses: carina-rs/provider-release/yank@25d0c075c00be49a703b532c91739cc5dc163fb4
        with:
          name: aws
          namespace: carina-rs
