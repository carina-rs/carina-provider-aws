name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin carina-provider-aws
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../carina-provider-aws-${{ github.ref_name }}-${{ matrix.target }}.tar.gz carina-provider-aws

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: carina-provider-aws-${{ matrix.target }}
          path: carina-provider-aws-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Build
        run: cargo build --release --target wasm32-wasip2 --bin carina-provider-aws

      - name: Optimize WASM with vela
        run: |
          cargo install --git https://github.com/mizzy/vela vela-cli --quiet
          vela optimize target/wasm32-wasip2/release/carina-provider-aws.wasm -o target/wasm32-wasip2/release/carina-provider-aws.wasm

      - name: Package
        run: |
          cp target/wasm32-wasip2/release/carina-provider-aws.wasm carina-provider-aws-${{ github.ref_name }}.wasm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: carina-provider-aws-wasm
          path: carina-provider-aws-${{ github.ref_name }}.wasm

  release:
    name: Create Release
    needs: [build, build-wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            carina-provider-aws-*.tar.gz
            carina-provider-aws-*.wasm
          generate_release_notes: true

  publish:
    name: Publish to Carina Registry
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      REGISTRY_AUDIENCE: registry-dev.carina-rs.dev
      REGISTRY_PUBLISH_URL: https://publish.registry-dev.carina-rs.dev/v1/publish
    steps:
      - name: Publish
        # A 403 claim_mismatch usually means the trusted-publisher policy's job_workflow_sha
        # does not match the commit targeted by the tag. Release order: finalize the commit,
        # update infra's registry-policy/dev/publish-policy/carina-rs.json SHA, then push the tag.
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          asset_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/carina-provider-aws-${GITHUB_REF_NAME}.wasm"
          payload=$(jq -n \
            --arg version "$version" \
            --arg asset_url "$asset_url" \
            '{
              namespace: "carina-rs",
              name: "aws",
              version: $version,
              candidate_download_url: $asset_url
            }')
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT

          for attempt in 1 2 3; do
            if ! token=$(curl -sS \
              --connect-timeout 10 \
              --max-time 60 \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${REGISTRY_AUDIENCE}" \
              | jq -er .value) || [ -z "$token" ]; then
              printf 'Failed to obtain OIDC token on attempt %s\n' "$attempt" >&2
              if [ "$attempt" -lt 3 ]; then
                sleep 10
                continue
              fi
              printf 'Publish failed after 3 attempts while obtaining OIDC token\n' >&2
              exit 1
            fi

            : > "$response_file"
            if ! status=$(curl -sS \
              --connect-timeout 10 \
              --max-time 120 \
              -o "$response_file" \
              -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $token" \
              -H 'Content-Type: application/json' \
              --data "$payload" \
              "$REGISTRY_PUBLISH_URL"); then
              status=000
            fi

            printf 'Publish attempt %s returned HTTP %s\n' "$attempt" "$status"
            sed 's/^/  /' "$response_file"
            printf '\n'

            case "$status" in
              200|201)
                exit 0
                ;;
              000|429|5??)
                if [ "$attempt" -lt 3 ]; then
                  sleep 10
                  continue
                fi
                printf 'Publish failed after 3 attempts (last status: %s)\n' "$status" >&2
                exit 1
                ;;
              4??)
                printf 'Publish failed with non-retryable status %s\n' "$status" >&2
                exit 1
                ;;
              *)
                printf 'Publish failed with unexpected status %s\n' "$status" >&2
                exit 1
                ;;
            esac
          done
