[package]
name = "carina-provider-aws-wasm-tests"
version.workspace = true
edition = "2024"
license = "MIT"
publish = false
description = "Integration tests for the AWS provider WASM component"

[[test]]
name = "desired_normalization_wasm"
path = "tests/desired_normalization_wasm.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
carina-core = { workspace = true, features = ["test-utils"] }
carina-plugin-host = { workspace = true, features = ["test-utils"] }
carina-provider-resolver = { workspace = true, features = ["test-utils"] }
indexmap = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
