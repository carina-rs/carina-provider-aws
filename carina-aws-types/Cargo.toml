[package]
name = "carina-aws-types"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "AWS type definitions for Carina infrastructure management tool"

[features]
default = []
account = ["dep:aws-sdk-account"]
acm = ["dep:aws-sdk-acm"]
cloudcontrol = ["dep:aws-sdk-cloudcontrol"]
cloudwatchlogs = ["dep:aws-sdk-cloudwatchlogs"]
ec2 = ["dep:aws-sdk-ec2"]
iam = ["dep:aws-sdk-iam"]
identitystore = ["dep:aws-sdk-identitystore"]
kms = ["dep:aws-sdk-kms"]
organizations = ["dep:aws-sdk-organizations"]
route53 = ["dep:aws-sdk-route53"]
s3 = ["dep:aws-sdk-s3"]
sqs = ["dep:aws-sdk-sqs"]
sts = ["dep:aws-sdk-sts"]
test-utils = ["dep:carina-plugin-sdk", "carina-plugin-sdk/test-utils", "dep:wasi"]

[dev-dependencies]
carina-core = { workspace = true, features = ["test-support"] }
aws-smithy-async = { version = "1", features = ["test-util"] }
aws-smithy-runtime-api = { version = "1.19", features = ["client", "test-util"] }
carina-plugin-sdk = { workspace = true, features = ["test-utils"] }
indexmap = "2"
tokio = { version = "1", features = ["macros", "rt", "test-util", "time"] }
toml = "0.9"
wasi = "0.14"

[dependencies]
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio"] }
aws-sdk-account = { version = "1", optional = true, default-features = false, features = ["behavior-version-latest"] }
aws-sdk-acm = { version = "1.125.0", optional = true, default-features = false, features = ["behavior-version-latest"] }
aws-sdk-cloudcontrol = { version = "1", optional = true, default-features = false, features = ["behavior-version-latest"] }
aws-sdk-cloudwatchlogs = { version = "1", optional = true, default-features = false, features = ["behavior-version-latest"] }
aws-sdk-ec2 = { version = "1.273.0", optional = true, default-features = false, features = ["behavior-version-latest"] }
aws-sdk-iam = { version = "1", optional = true, default-features = false, features = ["behavior-version-latest"] }
aws-sdk-identitystore = { version = "1", optional = true, default-features = false, features = ["behavior-version-latest"] }
aws-sdk-kms = { version = "1.127.0", optional = true, default-features = false, features = ["behavior-version-latest"] }
aws-sdk-organizations = { version = "1", optional = true, default-features = false, features = ["behavior-version-latest"] }
aws-sdk-route53 = { version = "1", optional = true, default-features = false, features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1", optional = true, default-features = false, features = ["behavior-version-latest"] }
aws-sdk-sqs = { version = "1", optional = true, default-features = false, features = ["behavior-version-latest"] }
aws-sdk-sts = { version = "1", optional = true, default-features = false, features = ["behavior-version-latest"] }
aws-types = { version = "1" }
aws-runtime = { version = "1" }
aws-smithy-runtime = { version = "1", features = ["client"] }
aws-credential-types = { version = "1" }
aws-smithy-runtime-api = { version = "1.19", features = ["client"] }
aws-smithy-types = { version = "1" }
carina-core = { workspace = true }
carina-provider-protocol = { workspace = true }
futures = "0.3"
heck = "0.5"
idna = "1.1.0"
regex = "1"
url = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
carina-plugin-sdk = { workspace = true, optional = true }
wasi = { version = "0.14", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
carina-plugin-sdk = { workspace = true }
wasi = "0.14"
